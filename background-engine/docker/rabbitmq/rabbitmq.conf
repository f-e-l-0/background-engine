# Quorum queues are the default type; classic queues are not replicated.
default_queue_type = quorum

# Publishers are blocked when the node uses more than 60% of RAM.
vm_memory_high_watermark.relative = 0.6

# Publishers are blocked when free disk drops below 2 GB.
disk_free_limit.absolute = 2GB

# Long-running tasks: how long a consumer may hold an unacked message (ms) before the broker
# closes its channel. 30 minutes covers slow report generation.
consumer_timeout = 1800000

# Single node for local development. For a 3-node cluster, replace this with classic_config
# peer discovery listing rabbit@rabbitmq-1, rabbit@rabbitmq-2, rabbit@rabbitmq-3.
